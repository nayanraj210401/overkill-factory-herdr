# .factory/blueprints/feature.yaml
# Each stage names a shared step (.factory/steps/<name>.yaml, else ~/.factory/steps/);
# a field set here wins over the step's, like per: slice on implement.
name: feature
description: "New behaviour a user will notice: it needs a spec before anyone builds it."
orchestrator: foreman
start: spec
stages:
  spec:      { step: write-spec, next: [plan, implement] }
  plan:      { step: plan-slices, next: [implement] }
  implement: { step: build, per: slice, next: [verify] }
  verify:    { step: check-evidence, next: [holdout], on_fail: implement }
  holdout:   { step: holdout, next: [review], on_fail: implement }
  review:    { step: review, next: [pr], on_fail: implement }
  pr:        { step: write-pr, next: [merge] }
  merge:     { step: merge, next: [end] }
