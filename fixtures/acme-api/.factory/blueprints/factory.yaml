# .factory/blueprints/factory.yaml
# A change to the factory itself, asked for in Overwatch (`factory request`). The
# maintainer edits .factory/ in the ticket's worktree; the factory check proves the files
# pass the schema check and nothing outside .factory/ changed; the PR waits for you.
# Grooming never picks it. factory.yaml's maintainer.gate sets the merge gate.
name: factory
start: maintain
stages:
  maintain: { agent: maintainer, output: PR.md, next: [check] }
  check:    { check: factory, next: [pr], on_fail: maintain, max_retries: 2 }
  pr:       { requires: ready, output: PR.md, template: pr-readable, next: [merge] }
  merge:    { gate: human, next: [end] }
