# .factory/blueprints/bugfix.yaml
# Each stage names a shared step (.factory/steps/<name>.yaml, else ~/.factory/steps/):
# the step says what runs, the blueprint says where it goes next.
name: bugfix
orchestrator: foreman
start: implement
stages:
  implement: { step: build, next: [verify] }
  verify:    { step: run-tests, next: [review], on_fail: implement }
  review:    { step: review, next: [pr], on_fail: implement }
  pr:        { step: write-pr, next: [merge] }
  merge:     { step: merge, next: [end] }
